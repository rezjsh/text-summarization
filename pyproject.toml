[project]
name = "text-summarization-project"
version = "0.1.0"
description = "End-to-end abstractive text summarization on CNN/DailyMail (Kaggle) with EDA, training, evaluation, inference and a Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2",
    "transformers>=4.41",
    "datasets>=2.19",
    "evaluate>=0.4.2",
    "rouge-score>=0.1.2",
    "accelerate>=0.30",
    "sentencepiece>=0.2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "kaggle>=1.6",
    "streamlit>=1.35",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
]
bertscore = [
    "bert-score>=0.3.13",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
