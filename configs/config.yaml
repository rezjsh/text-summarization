# Master config - references the other config files.
# Loaded by src/text_summarization_project/config/configuration.py

project_name: text_summarization_project

artifacts_root: artifacts
data_root: data
logs_root: logs

data_ingestion:
  kaggle_dataset: "gowrishankarp/newspaper-text-summarization-cnn-dailymail"
  raw_dir: data/raw
  unzip_dir: data/raw/cnn_dailymail
  # File names inside the kaggle dataset once extracted (dataset ships 3 CSVs)
  expected_files:
    - train.csv
    - validation.csv
    - test.csv

eda:
  output_dir: artifacts/eda
  sample_size_for_token_plots: 5000
  top_n_words: 30
  ngram_range: [2, 3]

preprocessing:
  interim_dir: data/interim
  processed_dir: data/processed
  min_article_chars: 200
  max_article_chars: 20000
  min_summary_chars: 20
  max_summary_chars: 2000
  lowercase: false
  drop_duplicates: true
  drop_na: true

dataset:
  # subset "size" presets, see dataset/registry.py for details
  active_subset: medium
  text_column: article
  summary_column: highlights

model:
  active_model: flan-t5-small
  max_input_length: 512
  max_target_length: 128

training:
  output_dir: artifacts/checkpoints
  logging_dir: logs/training
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  gradient_accumulation_steps: 2
  fp16: false
  save_total_limit: 2
  early_stopping_patience: 2
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  seed: 42

evaluation:
  output_dir: artifacts/evaluation
  metrics: [rouge1, rouge2, rougeL, rougeLsum]
  compute_bertscore: false
  measure_latency: true

generation:
  max_new_tokens: 128
  min_new_tokens: 8
  num_beams: 4
  length_penalty: 2.0
  no_repeat_ngram_size: 3
  early_stopping: true
